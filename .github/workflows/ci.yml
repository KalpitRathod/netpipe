name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libpcap-dev valgrind

      - name: Build release version
        run: make

      - name: Build debug version
        run: make debug

      - name: Run version check
        run: ./build/bin/netpipe --version

      - name: Run unit test suite
        run: make test

      - name: Run Valgrind leak check
        run: valgrind --error-exitcode=1 ./build/bin/netpipe -r tests/fixtures/dns.pcap -fmt null

      - name: Build fuzz harness
        run: make fuzz

      - name: Fuzz regression smoke-test (corpus replay)
        run: |
          for f in tests/fixtures/*.pcap; do
            ./build/bin/fuzz_demux < "$f"
          done
          echo "  ✓  fuzz harness processed all fixture files cleanly"
